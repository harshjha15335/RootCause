[project]
name = "rootcause"
version = "0.3.0"
requires-python = ">=3.12"
description = "Root Cause local evidence-first backend"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
include = ["api", "agents", "functions", "tests", "scripts", "eval", "engine", "debugger", "data_export"]
